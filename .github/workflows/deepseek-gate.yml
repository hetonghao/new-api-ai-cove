name: DeepSeek Relay Gate

on:
  push:
    paths:
      - 'relay/channel/deepseek/**'
      - 'relay/channel/newapi/adaptor.go'
      - 'relay/channel/openai/relay_responses.go'
      - 'relay/common/deepseek_*.go'
      - 'relay/responses_handler.go'
      - 'relay/chat_completions_via_responses.go'
      - 'makefile'
      - '.github/workflows/deepseek-gate.yml'
  pull_request:
    paths:
      - 'relay/channel/deepseek/**'
      - 'relay/channel/newapi/adaptor.go'
      - 'relay/channel/openai/relay_responses.go'
      - 'relay/common/deepseek_*.go'
      - 'relay/responses_handler.go'
      - 'relay/chat_completions_via_responses.go'
      - 'makefile'
      - '.github/workflows/deepseek-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: DeepSeek relay gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Run DeepSeek relay gate
        run: make deepseek-gate
